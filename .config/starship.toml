"$schema" = 'https://starship.rs/config-schema.json'

[username]
disabled = false
show_always = true
format = "[$user]($style)"

[hostname]
disabled = false
ssh_only = false
format = "@[$hostname]($style):"

[kubernetes]
disabled = false
format = " [$symbol$context/$namespace ]($style)"
symbol = "󰠳 "

[[kubernetes.contexts]]
context_pattern = "gke_(?<project>[^_]+)_(?<location>[^_]+)_(?<name>[^_]+)"
context_alias = "$name"

[gcloud]
disabled = true

[aws]
symbol = "  "

