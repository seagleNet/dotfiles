# Let the graph follow the stream's sample rate (44.1k for most of Tidal)
# instead of resampling everything to 48k. These are the Schiit Modi+ rates,
# a device without one of them falls back to resampling as before.
# PipeWire only switches when the device is idle or the stream is alone.
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}
